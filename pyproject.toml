[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chordelia"
version = "0.4.0-rc2"
description = "A comprehensive music theory library built around algorithmic approaches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core music theory - no external dependencies
]

[project.optional-dependencies]
# Audio playback support
audio = [
    "sounddevice>=0.4.0",
    "numpy>=1.20.0",
]

# MIDI file support
midi = [
    "mido>=1.3.0",
    "python-rtmidi>=1.4.0",
]

# Complete audio experience (playback + MIDI)
all = [
    "sounddevice>=0.4.0",
    "numpy>=1.20.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/lzulauf/chordelia"
Source = "https://github.com/lzulauf/chordelia"
Issues = "https://github.com/lzulauf/chordelia/issues"

[tool.setuptools.packages.find]
where = ["src"]


[tool.bumpversion]
current_version = "0.4.0-rc2"
files = [
    { filename = "pyproject.toml" },
    { filename = "src/chordelia/__init__.py" }
]
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        -                             # dash separator for pre-release section
        (?P<pre_l>[a-zA-Z-]+)         # pre-release label
        (?P<pre_n>0|[1-9]\\d*)        # pre-release version number
    )?                                # pre-release section is optional
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = true
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = true

[tool.bumpversion.parts.pre_l]
values = ["dev", "rc", "final"]
optional_value = "final"

[dependency-groups]
# Development dependencies
dev = [
    "chordelia",
    "ipython>=8.18.0,<9.0.0; python_version < '3.11'",
    "ipython>=9.6.0; python_version >= '3.11'",
    "pip>=25.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "uv>=0.9.2",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
chordelia = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "optional_audio: marks tests requiring optional audio dependencies",
]
